<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noble Quran – القرآن الكريم</title>
    
    <meta name="theme-color" content="#064e3b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Noble Quran">
    
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;500;600;700&family=Noto+Sans:wght@300;400;500;600&family=Noto+Nastaliq+Urdu:wght@400..700&display=swap');
        
        :root {
            --bg: #fafaf9;
            --text: #1e293b;
            --card: #ffffff;
            --border: #e7e5e4;
            --muted: #78716c;
        }
        .dark {
            --bg: #0c0a09;
            --text: #f5f5f4;
            --card: #1c1917;
            --border: #292524;
            --muted: #a8a29e;
        }
        body {
            font-family: 'Noto Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overscroll-behavior-y: none;
            transition: background-color 0.3s, color 0.3s;
        }
        .font-indopak { font-family: 'Scheherazade New', serif; line-height: 2.3; }
        .font-urdu { font-family: 'Noto Nastaliq Urdu', serif; line-height: 2.2; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #d6d3d1; border-radius: 20px; }
        .dark ::-webkit-scrollbar-thumb { background-color: #44403c; }
        .number-symbol {
            display: inline-flex; align-items: center; justify-content: center;
            width: 2rem; height: 2rem; border: 1px solid currentColor;
            border-radius: 50%; font-size: 0.9rem; opacity: 0.8;
            margin-right: 0.5rem; font-family: 'Noto Sans', sans-serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        if ('serviceWorker' in navigator) {
            const swCode = `self.addEventListener('install', e => self.skipWaiting()); self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));`;
            const blob = new Blob([swCode], {type: 'text/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icons = {
            BookOpen: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
            Search: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
            Play: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" {...props}><polygon points="5 3 19 12 5 21 5 3"/></svg>,
            Pause: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" {...props}><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>,
            Menu: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>,
            X: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            ChevronRight: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="m9 18 6-6-6-6"/></svg>
        };

        const QuranApp = () => {
            const [surahs, setSurahs] = useState([]);
            const [currentSurah, setCurrentSurah] = useState(null);
            const [surahData, setSurahData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [loadingSurah, setLoadingSurah] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const [playingAudio, setPlayingAudio] = useState(null);
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const [viewMode, setViewMode] = useState('translation');
            const [audioLanguage, setAudioLanguage] = useState('arabic');
            const [theme, setTheme] = useState(() => localStorage.getItem('quran-theme') || 'system');
            const audioRef = useRef(new Audio());

            // Theme
            useEffect(() => {
                const root = document.documentElement;
                const apply = (t) => {
                    if (t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                        root.classList.add('dark');
                    } else {
                        root.classList.remove('dark');
                    }
                };
                apply(theme);
                localStorage.setItem('quran-theme', theme);
                const mq = window.matchMedia('(prefers-color-scheme: dark)');
                const handler = () => { if (theme === 'system') apply('system'); };
                mq.addEventListener('change', handler);
                return () => mq.removeEventListener('change', handler);
            }, [theme]);

            const cycleTheme = () => {
                setTheme(prev => prev === 'light' ? 'dark' : prev === 'dark' ? 'system' : 'light');
            };

            useEffect(() => {
                const fetchSurahs = async () => {
                    try {
                        const res = await fetch('https://api.alquran.cloud/v1/surah');
                        const data = await res.json();
                        setSurahs(data.data);
                    } catch (e) { console.error(e); }
                    setLoading(false);
                };
                fetchSurahs();
                if (window.innerWidth < 768) setIsSidebarOpen(false);
            }, []);

            useEffect(() => {
                if (!currentSurah) return;
                const fetchSurahData = async () => {
                    setLoadingSurah(true);
                    setSurahData(null);
                    try {
                        const res = await fetch(`https://api.alquran.cloud/v1/surah/${currentSurah.number}/editions/quran-indopak,en.sahih,ur.junagarhi,ar.alafasy,ur.khan`);
                        const data = await res.json();
                        setSurahData({ arabic: data.data[0], english: data.data[1], urdu: data.data[2], audioArabic: data.data[3], audioUrdu: data.data[4] });
                    } catch (e) { console.error(e); }
                    setLoadingSurah(false);
                };
                fetchSurahData();
                if (window.innerWidth < 768) setIsSidebarOpen(false);
            }, [currentSurah]);

            useEffect(() => {
                if (playingAudio) {
                    const idx = playingAudio.split(':')[1];
                    const el = document.getElementById(`verse-${idx}`);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, [playingAudio]);

            const playAudio = (ayahIndex) => {
                if (!surahData) return;
                let audioUrl = audioLanguage === 'arabic' 
                    ? surahData.audioArabic.ayahs[ayahIndex].audio
                    : (surahData.audioUrdu?.ayahs[ayahIndex]?.audio || `https://everyayah.com/data/Urdu_Shamshad_Ali_Khan_46kbps/${String(currentSurah.number).padStart(3,'0')}${String(surahData.arabic.ayahs[ayahIndex].numberInSurah).padStart(3,'0')}.mp3`);

                const key = `${currentSurah.number}:${ayahIndex}`;
                if (playingAudio === key) {
                    if (audioRef.current.paused) audioRef.current.play().catch(console.error);
                    else { audioRef.current.pause(); setPlayingAudio(null); }
                } else {
                    audioRef.current.src = audioUrl;
                    audioRef.current.load();
                    audioRef.current.play().catch(e => { console.error(e); alert('Could not play audio'); });
                    setPlayingAudio(key);
                    audioRef.current.onended = () => {
                        if (ayahIndex + 1 < surahData.arabic.ayahs.length) playAudio(ayahIndex + 1);
                        else setPlayingAudio(null);
                    };
                }
            };

            const filteredSurahs = surahs.filter(s => 
                s.englishName.toLowerCase().includes(searchTerm.toLowerCase()) ||
                s.englishNameTranslation.toLowerCase().includes(searchTerm.toLowerCase()) ||
                String(s.number).includes(searchTerm)
            );

            return (
                <div className="flex h-screen bg-stone-50 dark:bg-stone-950 text-slate-800 dark:text-stone-100 font-sans overflow-hidden">
                    {isSidebarOpen && <div className="fixed inset-0 bg-black/50 z-20 md:hidden" onClick={() => setIsSidebarOpen(false)} />}

                    {/* Sidebar */}
                    <div className={`fixed md:static inset-y-0 left-0 z-30 w-72 bg-white dark:bg-stone-900 border-r border-stone-200 dark:border-stone-800 transform transition-transform duration-300 flex flex-col shadow-xl md:shadow-none ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                        <div className="p-4 border-b border-stone-100 dark:border-stone-800 bg-emerald-900 text-white">
                            <h1 className="flex items-center gap-2 text-xl font-bold font-serif mb-1"><Icons.BookOpen className="w-6 h-6" /> Noble Quran</h1>
                            <p className="text-emerald-200 text-xs opacity-80">Indo-Pak Script</p>
                        </div>
                        <div className="p-3 bg-stone-50 dark:bg-stone-900">
                            <div className="relative">
                                <div className="absolute left-3 top-2.5 text-stone-400"><Icons.Search width="16" height="16" /></div>
                                <input type="text" placeholder="Search Surah..." className="w-full pl-9 pr-4 py-2 bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto">
                            {loading ? <div className="flex justify-center p-8"><div className="animate-spin rounded-full h-8 w-8 border-b-2 border-emerald-600"></div></div> : (
                                <div className="divide-y divide-stone-100 dark:divide-stone-800">
                                    {filteredSurahs.map(surah => (
                                        <button key={surah.number} onClick={() => setCurrentSurah(surah)} className={`w-full p-4 flex items-center justify-between hover:bg-stone-50 dark:hover:bg-stone-800 text-left group ${currentSurah?.number === surah.number ? 'bg-emerald-50 dark:bg-emerald-950 border-l-4 border-emerald-600' : ''}`}>
                                            <div className="flex items-center gap-3">
                                                <div className={`w-10 h-10 rounded-full flex items-center justify-center text-sm font-semibold ${currentSurah?.number === surah.number ? 'bg-emerald-600 text-white' : 'bg-stone-100 dark:bg-stone-800 text-stone-600 dark:text-stone-300'}`}>{surah.number}</div>
                                                <div>
                                                    <h3 className={`font-semibold text-sm ${currentSurah?.number === surah.number ? 'text-emerald-900 dark:text-emerald-300' : ''}`}>{surah.englishName}</h3>
                                                    <p className="text-xs text-stone-500">{surah.englishNameTranslation}</p>
                                                </div>
                                            </div>
                                            <span className="font-indopak text-lg">{surah.name.replace('سُورَةُ ', '')}</span>
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Main */}
                    <div className="flex-1 flex flex-col h-full overflow-hidden">
                        <header className="h-auto md:h-16 bg-white dark:bg-stone-900 border-b border-stone-200 dark:border-stone-800 flex flex-col md:flex-row items-center justify-between px-4 py-2 shadow-sm z-10 shrink-0 gap-3">
                            <div className="flex items-center gap-4 w-full md:w-auto">
                                <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="md:hidden p-2 -ml-2 rounded-lg hover:bg-stone-100 dark:hover:bg-stone-800">{isSidebarOpen ? <Icons.X size={20} /> : <Icons.Menu size={20} />}</button>
                                {currentSurah ? (
                                    <h2 className="text-lg font-bold flex items-center gap-2">{currentSurah.englishName}<span className="hidden sm:inline text-stone-400">|</span><span className="hidden sm:inline font-indopak text-2xl text-emerald-800 dark:text-emerald-400">{currentSurah.name}</span></h2>
                                ) : <h2 className="text-lg font-bold">Welcome</h2>}
                            </div>

                            <div className="flex items-center gap-2 w-full md:w-auto justify-end">
                                <button onClick={cycleTheme} className="flex items-center gap-1.5 px-3 py-1.5 bg-stone-100 dark:bg-stone-800 rounded-lg text-sm font-medium hover:bg-stone-200 dark:hover:bg-stone-700 transition-colors" title="Change theme">
                                    {theme === 'light' ? '☀️ Light' : theme === 'dark' ? '🌙 Dark' : '💻 System'}
                                </button>

                                {currentSurah && (
                                    <>
                                        <div className="flex bg-stone-100 dark:bg-stone-800 rounded-lg p-1">
                                            <button onClick={() => setAudioLanguage('arabic')} className={`px-3 py-1 text-xs font-medium rounded-md ${audioLanguage === 'arabic' ? 'bg-white dark:bg-stone-700 shadow text-emerald-700 dark:text-emerald-400' : 'text-stone-500'}`}>Arabic</button>
                                            <button onClick={() => setAudioLanguage('urdu')} className={`px-3 py-1 text-xs font-medium rounded-md ${audioLanguage === 'urdu' ? 'bg-white dark:bg-stone-700 shadow text-emerald-700 dark:text-emerald-400' : 'text-stone-500'}`}>Urdu</button>
                                        </div>
                                        <div className="flex bg-stone-100 dark:bg-stone-800 rounded-lg p-1">
                                            <button onClick={() => setViewMode('translation')} className={`px-3 py-1 text-xs font-medium rounded-md ${viewMode === 'translation' ? 'bg-white dark:bg-stone-700 shadow text-emerald-700 dark:text-emerald-400' : 'text-stone-500'}`}>Trans.</button>
                                            <button onClick={() => setViewMode('reading')} className={`px-3 py-1 text-xs font-medium rounded-md ${viewMode === 'reading' ? 'bg-white dark:bg-stone-700 shadow text-emerald-700 dark:text-emerald-400' : 'text-stone-500'}`}>Read</button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </header>

                        <main className="flex-1 overflow-y-auto p-4 lg:p-8">
                            {loadingSurah ? (
                                <div className="flex flex-col items-center justify-center h-full gap-4 text-stone-400">
                                    <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-600"></div>
                                    <p className="text-sm">Loading Surah...</p>
                                </div>
                            ) : !currentSurah ? (
                                <div className="h-full flex flex-col items-center justify-center text-center max-w-lg mx-auto px-4">
                                    <img src="quran-original.jpg" alt="The Holy Quran" className="w-48 sm:w-56 rounded-xl shadow-2xl mb-8 object-cover" style={{aspectRatio: '5/7'}} />
                                    <h2 className="text-3xl font-bold mb-2 font-serif">Noble Quran</h2>
                                    <p className="text-xl text-emerald-800 dark:text-emerald-400 font-urdu mb-4" dir="rtl">القرآن الكريم</p>
                                    <p className="text-stone-600 dark:text-stone-400 leading-relaxed mb-8">Read and Listen with Indo-Pak script, English & Urdu translation, and bilingual audio.</p>
                                    <button onClick={() => setIsSidebarOpen(true)} className="md:hidden flex items-center gap-2 px-6 py-3 bg-emerald-600 text-white rounded-full font-medium shadow-lg">Choose a Surah <Icons.ChevronRight width="16" height="16" /></button>
                                    <p className="hidden md:block text-sm text-stone-400">Select a Surah from the sidebar to begin</p>
                                </div>
                            ) : surahData ? (
                                <div className="max-w-4xl mx-auto pb-20">
                                    {currentSurah.number !== 9 && (
                                        <div className="text-center mb-12 mt-4">
                                            <div className="font-indopak text-4xl md:text-5xl leading-relaxed">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
                                        </div>
                                    )}
                                    <div className="space-y-8">
                                        {surahData.arabic.ayahs.map((ayah, index) => {
                                            const isPlaying = playingAudio === `${currentSurah.number}:${index}`;
                                            return (
                                                <div key={ayah.number} id={`verse-${index}`} className={`relative p-4 md:p-6 rounded-2xl transition-all duration-500 ${isPlaying ? 'bg-emerald-50 dark:bg-emerald-950 ring-2 ring-emerald-200 dark:ring-emerald-800 shadow-md' : 'bg-white dark:bg-stone-900 hover:bg-stone-50 dark:hover:bg-stone-800 border border-transparent dark:border-stone-800'}`}>
                                                    <div className="flex flex-col gap-6">
                                                        <div className="flex items-center justify-between border-b border-stone-100 dark:border-stone-800 pb-3">
                                                            <span className="bg-stone-100 dark:bg-stone-800 px-3 py-1 rounded-full text-xs font-medium">{currentSurah.number}:{ayah.numberInSurah}</span>
                                                            <button onClick={() => playAudio(index)} className={`flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium ${isPlaying ? 'bg-emerald-600 text-white' : 'bg-stone-100 dark:bg-stone-800 hover:bg-emerald-100 dark:hover:bg-emerald-900'}`}>
                                                                {isPlaying ? <Icons.Pause width="12" height="12" /> : <Icons.Play width="12" height="12" />}
                                                                <span className="hidden sm:inline">{isPlaying ? 'Playing' : (audioLanguage === 'arabic' ? 'Listen Arabic' : 'Listen Urdu')}</span>
                                                                <span className="sm:hidden">{isPlaying ? 'Stop' : 'Play'}</span>
                                                            </button>
                                                        </div>
                                                        <div dir="rtl">
                                                            <p className={`font-indopak text-3xl md:text-4xl leading-[2.6] text-right ${isPlaying && audioLanguage === 'arabic' ? 'text-emerald-800 dark:text-emerald-300 font-bold' : ''}`}>
                                                                {ayah.text}
                                                                <span className="mr-2 inline-flex items-center justify-center w-8 h-8 text-lg border border-current rounded-full opacity-60 number-symbol">{ayah.numberInSurah}</span>
                                                            </p>
                                                        </div>
                                                        {viewMode === 'translation' && (
                                                            <div className="flex flex-col gap-5 border-t border-stone-100 dark:border-stone-800 pt-5 mt-2">
                                                                <p className="text-lg font-light leading-relaxed">{surahData.english.ayahs[index].text}</p>
                                                                <p className={`text-xl leading-loose font-urdu text-right ${isPlaying && audioLanguage === 'urdu' ? 'text-emerald-800 dark:text-emerald-300 font-bold' : ''}`} dir="rtl">{surahData.urdu.ayahs[index].text}</p>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            ) : null}
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<QuranApp />);
    </script>
</body>
</html>
