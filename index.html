<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noble Quran – القرآن الكريم</title>
    
    <meta name="theme-color" content="#064e3b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Noble Quran">
    <meta name="description" content="A beautiful Quran reader with Arabic (Indo-Pak), English and Urdu translations + audio">
    
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;500;600;700&family=Noto+Sans:wght@300;400;500;600&family=Noto+Nastaliq+Urdu:wght@400..700&display=swap');
        body { font-family: 'Noto Sans', sans-serif; background-color: #fafaf9; overscroll-behavior-y: none; }
        .font-indopak { font-family: 'Scheherazade New', serif; line-height: 2.3; }
        .font-urdu { font-family: 'Noto Nastaliq Urdu', serif; line-height: 2.2; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #d6d3d1; border-radius: 20px; }
        .number-symbol { display: inline-flex; align-items: center; justify-content: center; width: 2rem; height: 2rem; border: 1px solid currentColor; border-radius: 50%; font-size: 0.9rem; opacity: 0.8; margin-right: 0.5rem; font-family: 'Noto Sans', sans-serif; }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icons = {
            BookOpen: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
            Search: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
            Play: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polygon points="5 3 19 12 5 21 5 3"/></svg>,
            Pause: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>,
            Menu: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>,
            X: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            ChevronRight: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="m9 18 6-6-6-6"/></svg>,
            Download: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
            Share: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg>
        };

        const QuranApp = () => {
            const [surahs, setSurahs] = useState([]);
            const [currentSurah, setCurrentSurah] = useState(null);
            const [surahData, setSurahData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [loadingSurah, setLoadingSurah] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const [playingAudio, setPlayingAudio] = useState(null); 
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const [viewMode, setViewMode] = useState('translation'); 
            const [audioLanguage, setAudioLanguage] = useState('arabic');
            const [deferredPrompt, setDeferredPrompt] = useState(null);
            const [isInstalled, setIsInstalled] = useState(false);
            const [showIosInstruction, setShowIosInstruction] = useState(false);
            const audioRef = useRef(new Audio());

            useEffect(() => {
                if (window.matchMedia('(display-mode: standalone)').matches) setIsInstalled(true);
                const handleBeforeInstallPrompt = (e) => { e.preventDefault(); setDeferredPrompt(e); };
                window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
                return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
            }, []);

            const handleInstallClick = () => {
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                if (isIOS) { setShowIosInstruction(true); return; }
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then((choiceResult) => { if (choiceResult.outcome === 'accepted') setDeferredPrompt(null); });
                }
            };

            useEffect(() => {
                const fetchSurahs = async () => {
                    try {
                        const response = await fetch('https://api.alquran.cloud/v1/surah');
                        const data = await response.json();
                        setSurahs(data.data);
                        setLoading(false);
                    } catch (error) { console.error(error); setLoading(false); }
                };
                fetchSurahs();
                if (window.innerWidth < 768) setIsSidebarOpen(false);
            }, []);

            useEffect(() => {
                if (currentSurah) {
                    const fetchSurahData = async () => {
                        setLoadingSurah(true); setSurahData(null);
                        try {
                            const response = await fetch(`https://api.alquran.cloud/v1/surah/${currentSurah.number}/editions/quran-indopak,en.sahih,ur.junagarhi,ar.alafasy,ur.khan`);
                            const data = await response.json();
                            setSurahData({ arabic: data.data[0], english: data.data[1], urdu: data.data[2], audioArabic: data.data[3], audioUrdu: data.data[4] });
                        } catch (error) { console.error(error); }
                        setLoadingSurah(false);
                    };
                    fetchSurahData();
                    if (window.innerWidth < 768) setIsSidebarOpen(false);
                }
            }, [currentSurah]);

            useEffect(() => {
                if (playingAudio) {
                    const [surahNum, ayahIndex] = playingAudio.split(':');
                    const element = document.getElementById(`verse-${ayahIndex}`);
                    if (element) element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, [playingAudio]);

            const playAudio = (ayahIndex) => {
                if (!surahData) return;
                let audioUrl = "";
                if (audioLanguage === 'arabic') {
                    audioUrl = surahData.audioArabic.ayahs[ayahIndex].audio;
                } else {
                    if (surahData.audioUrdu && surahData.audioUrdu.ayahs[ayahIndex].audio) {
                        audioUrl = surahData.audioUrdu.ayahs[ayahIndex].audio;
                    } else {
                        const pad3 = (num) => String(num).padStart(3, '0');
                        audioUrl = `https://everyayah.com/data/Urdu_Shamshad_Ali_Khan_46kbps/${pad3(currentSurah.number)}${pad3(surahData.arabic.ayahs[ayahIndex].numberInSurah)}.mp3`;
                    }
                }
                const audioKey = `${currentSurah.number}:${ayahIndex}`;
                if (playingAudio === audioKey) {
                    if (audioRef.current.paused) audioRef.current.play().catch(console.error);
                    else { audioRef.current.pause(); setPlayingAudio(null); }
                } else {
                    audioRef.current.src = audioUrl;
                    audioRef.current.load();
                    audioRef.current.play().catch(e => { console.error(e); alert("Could not play audio. Please check internet connection."); });
                    setPlayingAudio(audioKey);
                    audioRef.current.onended = () => {
                        if (ayahIndex + 1 < surahData.arabic.ayahs.length) playAudio(ayahIndex + 1);
                        else setPlayingAudio(null);
                    };
                }
            };

            const filteredSurahs = surahs.filter(surah => 
                surah.englishName.toLowerCase().includes(searchTerm.toLowerCase()) ||
                surah.englishNameTranslation.toLowerCase().includes(searchTerm.toLowerCase()) ||
                String(surah.number).includes(searchTerm)
            );

            return (
                <div className="flex h-screen bg-stone-50 text-slate-800 font-sans overflow-hidden">
                    {showIosInstruction && (
                        <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/40" onClick={() => setShowIosInstruction(false)}>
                            <div className="bg-white w-full max-w-md p-6 rounded-t-2xl shadow-2xl animate-slide-up" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-start mb-4">
                                    <h3 className="text-lg font-bold text-slate-800">Install Noble Quran</h3>
                                    <button onClick={() => setShowIosInstruction(false)} className="text-slate-400"><Icons.X size={24}/></button>
                                </div>
                                <div className="space-y-4 text-slate-600">
                                    <p>To install this app on your iPhone/iPad:</p>
                                    <div className="flex items-center gap-3"><span className="flex items-center justify-center w-8 h-8 bg-slate-100 rounded-full font-bold">1</span><span>Tap the <Icons.Share size={16} className="inline mx-1"/> Share button in Safari.</span></div>
                                    <div className="flex items-center gap-3"><span className="flex items-center justify-center w-8 h-8 bg-slate-100 rounded-full font-bold">2</span><span>Scroll down and tap <strong>"Add to Home Screen"</strong>.</span></div>
                                </div>
                            </div>
                        </div>
                    )}

                    {isSidebarOpen && <div className="fixed inset-0 bg-black/50 z-20 md:hidden" onClick={() => setIsSidebarOpen(false)}/>}

                    <div className={`fixed md:static inset-y-0 left-0 z-30 w-72 bg-white border-r border-stone-200 transform transition-transform duration-300 ease-in-out flex flex-col shadow-xl md:shadow-none ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                        <div className="p-4 border-b border-stone-100 bg-emerald-900 text-white">
                            <h1 className="flex items-center gap-2 text-xl font-bold font-serif mb-1"><Icons.BookOpen className="w-6 h-6" /> Noble Quran</h1>
                            <p className="text-emerald-200 text-xs opacity-80">Indo-Pak Script</p>
                        </div>
                        <div className="p-3 bg-stone-50">
                            <div className="relative">
                                <div className="absolute left-3 top-2.5 text-stone-400"><Icons.Search width="16" height="16" /></div>
                                <input type="text" placeholder="Search Surah..." className="w-full pl-9 pr-4 py-2 bg-white border border-stone-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto">
                            {loading ? <div className="flex justify-center p-8"><div className="animate-spin rounded-full h-8 w-8 border-b-2 border-emerald-600"></div></div> : (
                                <div className="divide-y divide-stone-100">
                                    {filteredSurahs.map((surah) => (
                                        <button key={surah.number} onClick={() => setCurrentSurah(surah)} className={`w-full p-4 flex items-center justify-between hover:bg-stone-50 text-left group ${currentSurah?.number === surah.number ? 'bg-emerald-50 border-l-4 border-emerald-600' : ''}`}>
                                            <div className="flex items-center gap-3">
                                                <div className={`w-10 h-10 rounded-full flex items-center justify-center text-sm font-semibold ${currentSurah?.number === surah.number ? 'bg-emerald-600 text-white' : 'bg-stone-100 text-stone-600 group-hover:bg-emerald-100 group-hover:text-emerald-700'}`}>{surah.number}</div>
                                                <div>
                                                    <h3 className={`font-semibold text-sm ${currentSurah?.number === surah.number ? 'text-emerald-900' : 'text-slate-700'}`}>{surah.englishName}</h3>
                                                    <p className="text-xs text-stone-500">{surah.englishNameTranslation}</p>
                                                </div>
                                            </div>
                                            <span className="font-indopak text-lg text-stone-700">{surah.name.replace('سُورَةُ ', '')}</span>
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col h-full bg-stone-50 overflow-hidden relative">
                        <header className="h-auto md:h-16 bg-white border-b border-stone-200 flex flex-col md:flex-row items-center justify-between px-4 py-2 shadow-sm z-10 shrink-0 gap-3 md:gap-0">
                            <div className="flex items-center justify-between w-full md:w-auto">
                                <div className="flex items-center gap-4">
                                    <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="md:hidden p-2 -ml-2 text-stone-600 hover:bg-stone-100 rounded-lg">{isSidebarOpen ? <Icons.X size={20} /> : <Icons.Menu size={20} />}</button>
                                    {currentSurah ? (
                                        <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2">{currentSurah.englishName}<span className="hidden sm:inline text-stone-400 font-normal text-sm">|</span><span className="hidden sm:inline font-indopak font-normal text-2xl text-emerald-800">{currentSurah.name}</span></h2>
                                    ) : <h2 className="text-lg font-bold text-slate-800">Welcome</h2>}
                                </div>
                                {!isInstalled && (deferredPrompt || /iPad|iPhone|iPod/.test(navigator.userAgent)) && (
                                    <button onClick={handleInstallClick} className="md:hidden flex items-center gap-2 px-3 py-1.5 bg-emerald-600 text-white rounded-full text-xs font-medium"><Icons.Download size={14} /> Install</button>
                                )}
                            </div>
                            <div className="flex items-center gap-2 w-full md:w-auto justify-end">
                                {!isInstalled && (deferredPrompt || /iPad|iPhone|iPod/.test(navigator.userAgent)) && (
                                    <button onClick={handleInstallClick} className="hidden md:flex items-center gap-2 px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-700 mr-2"><Icons.Download size={16} /> Install App</button>
                                )}
                                {currentSurah && (
                                    <div className="flex items-center gap-3">
                                        <div className="flex bg-stone-100 rounded-lg p-1 mr-2">
                                            <button onClick={() => setAudioLanguage('arabic')} className={`px-3 py-1 text-xs font-medium rounded-md ${audioLanguage === 'arabic' ? 'bg-white shadow text-emerald-700' : 'text-stone-500'}`}>Arabic</button>
                                            <button onClick={() => setAudioLanguage('urdu')} className={`px-3 py-1 text-xs font-medium rounded-md ${audioLanguage === 'urdu' ? 'bg-white shadow text-emerald-700' : 'text-stone-500'}`}>Urdu</button>
                                        </div>
                                        <div className="flex bg-stone-100 rounded-lg p-1">
                                            <button onClick={() => setViewMode('translation')} className={`px-3 py-1 text-xs font-medium rounded-md ${viewMode === 'translation' ? 'bg-white shadow text-emerald-700' : 'text-stone-500'}`}>Trans.</button>
                                            <button onClick={() => setViewMode('reading')} className={`px-3 py-1 text-xs font-medium rounded-md ${viewMode === 'reading' ? 'bg-white shadow text-emerald-700' : 'text-stone-500'}`}>Read</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </header>

                        <main className="flex-1 overflow-y-auto p-4 lg:p-8">
                            {loadingSurah ? (
                                <div className="flex flex-col items-center justify-center h-full text-stone-400 gap-4">
                                    <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-600"></div>
                                    <p className="text-sm font-medium">Loading Surah...</p>
                                </div>
                            ) : !currentSurah ? (
                                <div className="h-full flex flex-col items-center justify-center text-center max-w-lg mx-auto px-4">
                                    <img src="quran-original.jpg" alt="The Holy Quran" className="w-48 sm:w-56 rounded-xl shadow-2xl mb-8 object-cover" style={{aspectRatio: '5/7'}} />
                                    <h2 className="text-3xl font-bold text-slate-800 mb-2 font-serif">Noble Quran</h2>
                                    <p className="text-xl text-emerald-800 font-urdu mb-4" dir="rtl">القرآن الكريم</p>
                                    <p className="text-stone-600 leading-relaxed mb-8">Read and Listen with Indo-Pak script, English & Urdu translation, and bilingual audio.</p>
                                    <button onClick={() => setIsSidebarOpen(true)} className="md:hidden flex items-center gap-2 px-6 py-3 bg-emerald-600 text-white rounded-full font-medium shadow-lg">Choose a Surah <Icons.ChevronRight width="16" height="16" /></button>
                                    <p className="hidden md:block text-sm text-stone-400 mt-2">Select a Surah from the sidebar to begin</p>
                                </div>
                            ) : surahData ? (
                                <div className="max-w-4xl mx-auto pb-20">
                                    {currentSurah.number !== 9 && (
                                        <div className="text-center mb-12 mt-4">
                                            <div className="font-indopak text-4xl md:text-5xl leading-relaxed text-slate-800">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
                                        </div>
                                    )}
                                    <div className="space-y-8">
                                        {surahData.arabic.ayahs.map((ayah, index) => {
                                            const isPlaying = playingAudio === `${currentSurah.number}:${index}`;
                                            return (
                                                <div key={ayah.number} id={`verse-${index}`} className={`relative p-4 md:p-6 rounded-2xl transition-all duration-500 ${isPlaying ? 'bg-emerald-50 ring-2 ring-emerald-200 shadow-md' : 'bg-white hover:bg-stone-50 border border-transparent hover:border-stone-100'}`}>
                                                    <div className="flex flex-col gap-6">
                                                        <div className="flex items-center justify-between border-b border-stone-100 pb-3">
                                                            <span className="bg-stone-100 text-stone-600 px-3 py-1 rounded-full text-xs font-medium">{currentSurah.number}:{ayah.numberInSurah}</span>
                                                            <button onClick={() => playAudio(index)} className={`flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium ${isPlaying ? 'bg-emerald-600 text-white' : 'bg-stone-100 text-slate-600 hover:bg-emerald-100 hover:text-emerald-700'}`}>
                                                                {isPlaying ? <Icons.Pause width="12" height="12" fill="currentColor" /> : <Icons.Play width="12" height="12" fill="currentColor" />}
                                                                <span className="hidden sm:inline">{isPlaying ? 'Playing' : (audioLanguage === 'arabic' ? 'Listen Arabic' : 'Listen Urdu')}</span>
                                                                <span className="sm:hidden">{isPlaying ? 'Stop' : 'Play'}</span>
                                                            </button>
                                                        </div>
                                                        <div dir="rtl" className="w-full">
                                                            <p className={`font-indopak text-3xl md:text-4xl leading-[2.6] text-slate-800 text-right ${isPlaying && audioLanguage === 'arabic' ? 'text-emerald-800 font-bold' : ''}`}>
                                                                {ayah.text}
                                                                <span className="mr-2 inline-flex items-center justify-center w-8 h-8 text-lg border border-current rounded-full opacity-60 number-symbol">{ayah.numberInSurah}</span>
                                                            </p>
                                                        </div>
                                                        {viewMode === 'translation' && (
                                                            <div className="flex flex-col gap-5 border-t border-stone-100 pt-5 mt-2">
                                                                <div className="text-left"><p className="text-lg text-slate-700 font-light leading-relaxed">{surahData.english.ayahs[index].text}</p></div>
                                                                <div className="text-right" dir="rtl"><p className={`text-xl text-slate-600 leading-loose font-urdu ${isPlaying && audioLanguage === 'urdu' ? 'text-emerald-800 font-bold' : ''}`}>{surahData.urdu.ayahs[index].text}</p></div>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            ) : null}
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<QuranApp />);
    </script>
</body>
</html>
