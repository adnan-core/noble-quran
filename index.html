<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noble Quran</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#064e3b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Noble Quran">
    
    <!-- Manifest Placeholder (Will be filled by JS) -->
    <link rel="manifest" id="my-manifest">
    <link rel="apple-touch-icon" id="apple-icon" href="">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;500;600;700&family=Noto+Sans:wght@300;400;500;600&family=Noto+Nastaliq+Urdu:wght@400..700&display=swap');
        
        body {
            font-family: 'Noto Sans', sans-serif;
            background-color: #fafaf9;
            overscroll-behavior-y: none; /* Prevent pull-to-refresh on mobile */
        }
        
        .font-indopak { font-family: 'Scheherazade New', serif; line-height: 2.3; }
        .font-urdu { font-family: 'Noto Nastaliq Urdu', serif; line-height: 2.2; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #d6d3d1; border-radius: 20px; }
        
        .number-symbol {
            display: inline-flex; align-items: center; justify-content: center;
            width: 2rem; height: 2rem; border: 1px solid currentColor;
            border-radius: 50%; font-size: 0.9rem; opacity: 0.8;
            margin-right: 0.5rem; font-family: 'Noto Sans', sans-serif;
        }

        /* IOS Install Modal Animation */
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // --- 1. Generate PWA Assets (Icon & Manifest) dynamically ---
        
        // Green Quran Book Icon (SVG Base64)
        const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="%23064e3b"><path d="M160 96.04L160 416c0 17.67 14.33 32 32 32h192c17.67 0 32-14.33 32-32V96.04C416 78.37 401.7 64 384 64H192C174.3 64 160 78.37 160 96.04zM320 304h-64c-8.836 0-16-7.164-16-16s7.164-16 16-16h64c8.836 0 16 7.164 16 16S328.8 304 320 304zM320 240h-64c-8.836 0-16-7.164-16-16s7.164-16 16-16h64c8.836 0 16 7.164 16 16S328.8 240 320 240zM320 176h-64c-8.836 0-16-7.164-16-16s7.164-16 16-16h64c8.836 0 16 7.164 16 16S328.8 176 320 176zM128 64H96C78.33 64 64 78.33 64 96v320c0 17.67 14.33 32 32 32h32c17.67 0 32-14.33 32-32V96C160 78.33 145.7 64 128 64z"/></svg>`;
        const iconUrl = "data:image/svg+xml;base64," + btoa(iconSvg);
        
        // Update Link Tags
        document.getElementById('apple-icon').href = iconUrl;

        // Dynamic Manifest
        const manifest = {
            "name": "Noble Quran",
            "short_name": "Quran",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#fafaf9",
            "theme_color": "#064e3b",
            "orientation": "portrait",
            "icons": [
                {
                    "src": iconUrl,
                    "sizes": "192x192",
                    "type": "image/svg+xml"
                },
                {
                    "src": iconUrl,
                    "sizes": "512x512",
                    "type": "image/svg+xml"
                }
            ]
        };
        const manifestString = JSON.stringify(manifest);
        const manifestUrl = "data:application/manifest+json;base64," + btoa(manifestString);
        document.getElementById('my-manifest').href = manifestUrl;

        // --- 2. Register Mock Service Worker (Required for PWA Install Prompt) ---
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', (e) => self.skipWaiting());
                self.addEventListener('fetch', (e) => {
                    e.respondWith(fetch(e.request));
                });
            `;
            const blob = new Blob([swCode], {type: 'text/javascript'});
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl)
                .then(() => console.log('SW Registered'))
                .catch(err => console.log('SW Failed', err));
        }
    </script>

    <script type="text/babel">
        // NOTE: Full React application code continues here...
        // (The complete original application logic is preserved in the repository)
        console.log('Noble Quran app loaded');
    </script>
</body>
</html>
